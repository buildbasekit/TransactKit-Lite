spring.application.name=transactkit-lite
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:mem:transactkit;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.h2.console.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.api-base=${STRIPE_API_BASE:}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/api-test/success.html}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/api-test/cancel.html}
